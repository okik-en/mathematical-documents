<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mdocs</title>
    <meta property="og:title" content="mdocs">
    <meta property="og:image" content="https://raw.githubusercontent.com/okik-en/mathematical-documents/master/okik-en.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="mdocs">
    <meta property="og:locale" content="ja_JP">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Emoji:wght@300..700&amp;family=Noto+Sans:ital,wght@0,100..900;1,100..900&amp;family=Noto+Sans+Math&amp;family=Noto+Sans+Mono:wght@100..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.css">
    <style>
      body{font-family: 'Noto Sans', 'Noto Emoji', sans-serif; text-autospace: normal; overflow-wrap: anywhere; word-break: normal; line-break: strict;}
      p{text-align: justify;}
      math{font-family: 'Noto Sans Math', 'Noto Emoji', math; padding: 1pt;}
      math[display='block']{flex-grow: 1; flex-shrink: 1; overflow-x: auto;}
      mtable, mrow{width: max-content;}
      code{font-family: 'Noto Sans Mono', 'Noto Emoji', monospace;}
      math, pre{overflow-x: auto; overflow-y: hidden; max-width: 100%;}
      a{text-decoration: none; display: inline-block; border-bottom: 1pt currentColor solid;}
      li{overflow-x: auto;}
      li p:first-child{display: inline;}
      ol{list-style-type: none; counter-reset: dec;}
      ol > li{counter-increment: dec;}
      ol > li:before{content: '(' counter(dec, decimal) ') ';}
      ol ol{list-style-type: none; counter-reset: llt;}
      ol ol > li{counter-increment: llt;}
      ol ol > li:before{content: '(' counter(llt, lower-latin) ') ';}
      ol div, ul div{display: inline-block;}
      nav li:before{content: '' !important;}
      figure{text-align: center;}
    </style>
  </head>
  <body>
    <main>
      <h1>mdocs</h1>
      <ul>
        <li><a href="./abstract-math">abstract-math</a></li>
        <li><a href="./probability-and-statistics">probability-and-statistics</a></li>
        <li><a href="./utils">utils</a></li>
      </ul>
      <hr>
      <p><small>Report any errors/issues on <a href="https://github.com/okik-en/mathematical-documents/issues">our repository</a>.<span style="white-space: pre-wrap">&#x20;</span><span id="last_updated"></span></small></p>
      <script>
(async () => document.getElementById('last_updated').textContent = await fetch('https://api.github.com/repos/okik-en/mathematical-documents/deployments').then(x => x.json()).then(x => `This site was last updated at ${new Date(Date.parse(x[0].updated_at)).toLocaleString()}.`))();
      </script>
    </main>
  </body>
</html>
